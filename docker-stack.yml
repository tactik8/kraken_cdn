name: file-upload-service

services:
  upload-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upload-api
    restart: unless-stopped
    ports:
      - "3012:3012"
    environment:
      - NODE_ENV=production
      - PORT=3012
    volumes:
      #- ./uploads:/app/uploads
      - /mnt/nas4:/app/uploads
    healthcheck:
      # Tests the new GET / endpoint on port 3012
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3012/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s